[project]
name = "my-easy-ui"
version = "0.1.0"
description = "A small dashboard server and browser renderer: dashboards are declarative YAML views over your own data that you or your AI agent can reshape at any time."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.29",
    "argon2-cffi>=23.1",
    "PyYAML>=6.0",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/josep-reyero/my-easy-ui"
Repository = "https://github.com/josep-reyero/my-easy-ui"
Issues = "https://github.com/josep-reyero/my-easy-ui/issues"

[project.scripts]
easy-ui = "easyui.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easyui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/conftest.py holds reusable helpers (make_demo_app, ...); this makes
# "from conftest import make_demo_app" work from any test module.
pythonpath = ["tests"]
filterwarnings = [
    # Starlette 1.x warns about httpx in its TestClient; the tests use it on purpose (dev-only).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
