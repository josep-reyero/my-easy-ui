# easy-ui ready-made theme. Copy it with: easy-ui theme use dusk
name: Dusk
description: An evening walk. Lavender and plum, rounded type, soft raised panels and generous room.

colors:
  accent: "#7a3e8e"
  background: "#f2eff5"
  surface: "#fdfbff"
  text: "#261d2e"
  muted: "#645a6e"
  border: "#e0d8e8"
  grid: "#ebe5f0"
  good: "#2f7a5d"
  bad: "#b0384a"
  chart: ["#7a3e8e", "#c8703f", "#3a7ca0", "#c2557a", "#5f8436"]

dark:
  accent: "#c79be0"
  background: "#17121c"
  surface: "#211a28"
  text: "#efe8f4"
  muted: "#a99db4"
  border: "#352c3e"
  grid: "#2b2333"
  good: "#86d3b0"
  bad: "#f5a0ae"
  chart: ["#c79be0", "#f0b088", "#8cc4e3", "#ee93b4", "#b7cf86"]

fonts:
  body: rounded
  headings: geometric
  numbers: rounded

type:
  size: 16
  scale: 1.28
radius: 22
density: roomy
cards: raised
chart:
  line_width: 2.5
  grid: solid
  area_opacity: 0.22
  bar_radius: 6
